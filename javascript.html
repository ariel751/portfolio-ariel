<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugas JavaScript</title>
  <link rel="stylesheet" href="./output.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col justify-between">

  <!-- NAVBAR -->
  <nav class="bg-gray-800 border-b border-gray-700 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold text-blue-400">Portofolio Saya</h1>
      <div class="space-x-6">
        <a href="index.html" class="hover:text-blue-400 transition">Beranda</a>
        <a href="projects.html" class="hover:text-blue-400 transition">Proyek</a>
        <a href="javascript.html" class="text-blue-400 font-semibold underline">Tugas JS</a>
      </div>
    </div>
  </nav>

  <!-- KONTEN FITUR JAVASCRIPT -->
  <main class="max-w-md mx-auto px-4 py-12 w-full">
    <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-xl">
      <h2 class="text-2xl font-bold mb-2 text-center text-blue-400">Kalkulator Nilai Akhir</h2>
      <p class="text-gray-400 text-sm text-center mb-6">Hitung rata-rata nilai tugas kuliah kamu di sini.</p>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Nilai Tugas 1</label>
          <input type="number" id="tugas1" placeholder="Masukkan nilai (0-100)" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Nilai Tugas 2</label>
          <input type="number" id="tugas2" placeholder="Masukkan nilai (0-100)" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
        </div>

        <button onclick="hitungNilai()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition shadow-md">
          Hitung Rata-Rata
        </button>

        <!-- KOTAK HASIL -->
        <div id="hasil" class="hidden mt-4 p-4 rounded-lg bg-gray-900 border border-gray-700 text-center">
          <p class="text-sm text-gray-400">Rata-Rata Nilai:</p>
          <p id="nilaiAkhir" class="text-3xl font-bold text-blue-400 my-1">0</p>
          <p id="statusKelulusan" class="text-sm font-semibold text-emerald-400"></p>
        </div>
      </div>
    </div>
  </main>

  <!-- SCRIPT JAVASCRIPT -->
  <script>
    function hitungNilai() {
      const val1 = parseFloat(document.getElementById('tugas1').value);
      const val2 = parseFloat(document.getElementById('tugas2').value);
      const hasilDiv = document.getElementById('hasil');

      if (isNaN(val1) || isNaN(val2)) {
        alert("Harap masukkan kedua nilai tugas dengan benar!");
        return;
      }

      const rataRata = (val1 + val2) / 2;
      document.getElementById('nilaiAkhir').innerText = rataRata.toFixed(1);

      const statusEl = document.getElementById('statusKelulusan');
      if (rataRata >= 70) {
        statusEl.innerText = "Status: LULUS 🎉";
        statusEl.className = "text-sm font-semibold text-emerald-400";
      } else {
        statusEl.innerText = "Status: PERLU PERBAIKAN ⚠️";
        statusEl.className = "text-sm font-semibold text-rose-400";
      }

      hasilDiv.classList.remove('hidden');
    }
  </script>

  <!-- FOOTER -->
  <footer class="bg-gray-800 border-t border-gray-700 py-4 text-center text-gray-400 text-sm">
    &copy; 2026 - Dibuat untuk Tugas Teknologi Web
  </footer>

</body>
</html>
